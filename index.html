<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>WANTED RUN</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;background:#141018;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#2c2433}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;z-index:5;padding:calc(8px + env(safe-area-inset-top)) 10px 0}
.row{display:flex;justify-content:space-between;gap:8px}
.panel{background:rgba(10,8,12,.86);border:1px solid #e8c547;padding:8px 10px;min-width:120px}
.label{font-size:10px;letter-spacing:.14em;color:#b7b3a8}
.val{font-size:20px;color:#e8c547;line-height:1.1}
.val.cash{color:#3ddc84}
.hp{height:8px;background:#3a2430;margin-top:6px}
.hp>i{display:block;height:100%;background:#e24b4b;width:100%}
.stars{color:#ff5a5a;letter-spacing:3px;margin-top:4px}
#toast{position:fixed;top:24%;left:50%;transform:translateX(-50%);color:#ffe07a;font-size:16px;letter-spacing:.12em;z-index:6;text-shadow:0 2px 0 #000;pointer-events:none;opacity:0}
#end{display:none;position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 24px));z-index:8;pointer-events:auto;background:#140f18;border:2px solid #e8c547;padding:18px 16px;text-align:center}
#end.show{display:block}
#end h1{margin:0 0 8px;color:#e8c547;letter-spacing:.16em;font-size:22px}
#end p{color:#ddd;font-size:13px;line-height:1.5;margin:0 0 14px}
#again{width:100%;border:0;background:#e8c547;color:#111;font:800 18px ui-monospace,monospace;letter-spacing:.12em;padding:14px}
#pad{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;z-index:7;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.28)}
#knob{position:absolute;width:58px;height:58px;border-radius:50%;background:#e8c547;left:41px;top:41px}
#btns{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;z-index:7}
.act{width:76px;height:76px;border-radius:50%;border:2px solid #e8c547;background:rgba(12,10,16,.8);color:#e8c547;font:800 12px ui-monospace,monospace}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="row">
<div class="panel"><div class="label">TIME</div><div class="val" id="time">0.0</div><div class="hp"><i id="hpbar"></i></div><div class="stars" id="stars">☆☆☆</div></div>
<div class="panel" style="text-align:right"><div class="label">CASH</div><div class="val cash" id="cash">$0</div><div class="label" id="best">BEST 0.0s</div></div>
</div></div>
<div id="toast">PUNCH TO ROB</div>
<div id="end"><h1>DOWN</h1><p id="last"></p><button id="again" type="button">PLAY AGAIN</button></div>
<div id="pad"><div id="knob"></div></div>
<div id="btns"><button class="act" id="btnCar" type="button">CAR</button><button class="act" id="btnPunch" type="button">PUNCH</button></div>
<script>
(() => {
const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
const pad=document.getElementById("pad"), knob=document.getElementById("knob");
const toastEl=document.getElementById("toast"), endEl=document.getElementById("end");
const TILE=44, COLS=52, ROWS=40, CONE_ANG=0.62, CONE_DIST=230;
let viewW=390, viewH=700, dpr=1;
function measure(){
  const vv=window.visualViewport;
  viewW=Math.max(300,Math.round((vv&&vv.width)||document.documentElement.clientWidth||window.innerWidth||390));
  viewH=Math.max(500,Math.round((vv&&vv.height)||document.documentElement.clientHeight||window.innerHeight||844));
  dpr=Math.min(2,window.devicePixelRatio||1);
  const w=Math.floor(viewW*dpr), h=Math.floor(viewH*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;ctx.setTransform(dpr,0,0,dpr,0,0);}
}
measure();
window.addEventListener("resize",measure);
window.addEventListener("orientationchange",()=>setTimeout(measure,80));
if(window.visualViewport) window.visualViewport.addEventListener("resize",measure);
const map=[];
function buildMap(){
  for(let y=0;y<ROWS;y++){
    map[y]=[];
    for(let x=0;x<COLS;x++){
      const edge=x===0||y===0||x===COLS-1||y===ROWS-1;
      const block=(x%7>1&&x%7<6)&&(y%6>1&&y%6<5);
      const gap=(x%7===3&&y%6>=2&&y%6<=4)||(y%6===3&&x%7>=2&&x%7<=5);
      map[y][x]=edge||(block&&!gap)?1:0;
    }
  }
  for(let y=18;y<=21;y++) for(let x=24;x<=27;x++) map[y][x]=0;
}
buildMap();
function blocked(px,py,r){
  const x0=Math.floor((px-r)/TILE),x1=Math.floor((px+r)/TILE),y0=Math.floor((py-r)/TILE),y1=Math.floor((py+r)/TILE);
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(y<0||x<0||y>=ROWS||x>=COLS||map[y][x]===1) return true;
  return false;
}
function los(ax,ay,bx,by){
  const dist=Math.hypot(bx-ax,by-ay), steps=Math.max(4,Math.ceil(dist/10));
  for(let i=1;i<steps;i++){
    const t=i/steps,x=ax+(bx-ax)*t,y=ay+(by-ay)*t;
    const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
    if(ty<0||tx<0||ty>=ROWS||tx>=COLS||map[ty][tx]===1) return false;
  }
  return true;
}
function inCone(cop,tx,ty){
  const dx=tx-cop.x, dy=ty-cop.y, d=Math.hypot(dx,dy);
  if(d>CONE_DIST||d<1) return d<=28;
  let diff=Math.atan2(dy,dx)-cop.a;
  while(diff>Math.PI) diff-=Math.PI*2;
  while(diff<-Math.PI) diff+=Math.PI*2;
  return Math.abs(diff)<CONE_ANG && los(cop.x,cop.y,tx,ty);
}
function openSpot(){
  for(let i=0;i<120;i++){
    const x=(2+Math.random()*(COLS-4))*TILE, y=(2+Math.random()*(ROWS-4))*TILE;
    if(!blocked(x,y,14)) return {x,y};
  }
  return {x:26*TILE,y:20*TILE};
}
const keys={};
window.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true; if(e.key==="Enter"&&state!=="run") start();});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
const stick={x:0,y:0,id:null};
function setStick(cx,cy){
  const r=pad.getBoundingClientRect();
  let mx=cx-(r.left+r.width/2), my=cy-(r.top+r.height/2);
  const mag=Math.hypot(mx,my)||1, k=Math.min(1,mag/48);
  stick.x=(mx/mag)*k; stick.y=(my/mag)*k;
  knob.style.left=41+stick.x*34+"px"; knob.style.top=41+stick.y*34+"px";
}
function clearStick(){stick.x=stick.y=0;stick.id=null;knob.style.left="41px";knob.style.top="41px";}
pad.addEventListener("pointerdown",e=>{e.preventDefault();stick.id=e.pointerId;pad.setPointerCapture(e.pointerId);setStick(e.clientX,e.clientY);if(state!=="run")start();});
pad.addEventListener("pointermove",e=>{if(e.pointerId===stick.id)setStick(e.clientX,e.clientY);});
pad.addEventListener("pointerup",clearStick);
pad.addEventListener("pointercancel",clearStick);
let punchTap=false,carTap=false;
document.getElementById("btnPunch").addEventListener("pointerdown",e=>{e.preventDefault();punchTap=true;if(state!=="run")start();});
document.getElementById("btnCar").addEventListener("pointerdown",e=>{e.preventDefault();carTap=true;if(state!=="run")start();});
document.getElementById("again").addEventListener("click",start);
let ac;
function beep(freq,dur,type,vol){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||"square";o.frequency.value=freq;g.gain.value=vol||0.05;
    o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);o.stop(ac.currentTime+dur);
  }catch(_){}
}
let state="boot",player,peds,cops,cars,bits,heat,cash,alive,best,shake,toastT,punchT;
best=Number(localStorage.getItem("wantedRunBest2")||0);
document.getElementById("best").textContent="BEST "+best.toFixed(1)+"s";
function toast(t){toastEl.textContent=t;toastEl.style.opacity=1;toastT=1.15;}
function spawnPed(){
  const p=openSpot();
  return {x:p.x,y:p.y,a:Math.random()*6.28,vx:0,vy:0,wait:Math.random(),r:11,hp:20,angry:0,robbed:false,col:18+Math.random()*40};
}
function spawnCar(){const p=openSpot();return {x:p.x,y:p.y,a:Math.random()*6.28};}
function spawnCop(alert){const p=openSpot();return {x:p.x,y:p.y,a:Math.random()*6.28,r:12,alert:alert?8:0,lost:0,stun:0};}
function resetWorld(){
  player={x:26*TILE,y:20*TILE,a:0,r:12,hp:100,inCar:false,cool:0,hurt:0};
  if(blocked(player.x,player.y,14)){const s=openSpot();player.x=s.x;player.y=s.y;}
  peds=Array.from({length:28},spawnPed);
  cops=[spawnCop(false),spawnCop(false),spawnCop(false)];
  cars=[spawnCar(),spawnCar(),spawnCar(),spawnCar(),spawnCar()];
  bits=[];heat=0;cash=0;alive=0;shake=0;punchT=0;
}
function wanted(){if(heat>=70)return 3;if(heat>=35)return 2;if(heat>=12)return 1;return 0;}
function addHeat(n){heat=Math.min(100,heat+n);}
function hurtPlayer(n){
  if(player.hurt>0)return;
  player.hp-=n;player.hurt=0.35;shake=8;beep(90,.08,"sawtooth",.05);
  if(player.hp<=0) down();
}
function pileOn(from){
  for(const p of peds){ if(p!==from && Math.hypot(p.x-from.x,p.y-from.y)<90) p.angry=6; }
}
function doPunch(){
  if(player.cool>0||player.inCar)return;
  player.cool=0.32; punchT=0.18;
  const fx=player.x+Math.cos(player.a)*22, fy=player.y+Math.sin(player.a)*22;
  let hit=null,bestD=34;
  for(const p of peds){const d=Math.hypot(p.x-fx,p.y-fy); if(d<bestD){bestD=d;hit=p;}}
  beep(180,.06,"square",.05);
  if(!hit){toast("WHIFF");return;}
  hit.hp-=12; hit.angry=7; pileOn(hit); addHeat(10);
  if(!hit.robbed){hit.robbed=true; const take=15+Math.floor(Math.random()*55); cash+=take; toast("PUNCH +$"+take);}
  else toast("FIGHT");
  const a=Math.atan2(hit.y-player.y,hit.x-player.x); hit.x+=Math.cos(a)*8; hit.y+=Math.sin(a)*8;
  for(let i=0;i<6;i++) bits.push({x:hit.x,y:hit.y,vx:(Math.random()-.5)*70,vy:(Math.random()-.5)*70,t:.3,col:"#e24b4b"});
}
function tryCar(){
  if(player.inCar){player.inCar=false;player.cool=0.2;toast("ON FOOT");return;}
  let car=null,d0=40;
  for(const c of cars){const d=Math.hypot(c.x-player.x,c.y-player.y); if(d<d0){d0=d;car=c;}}
  if(car){player.inCar=true;player.x=car.x;player.y=car.y;player.a=car.a;addHeat(4);toast("JACKED");player.cool=0.25;}
  else toast("NO CAR");
}
function move(o,dx,dy,r){ if(!blocked(o.x+dx,o.y,r)) o.x+=dx; if(!blocked(o.x,o.y+dy,r)) o.y+=dy; }
function start(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(_){}
  resetWorld(); state="run"; endEl.classList.remove("show"); toast("PUNCH TO ROB");
}
function down(){
  state="dead";
  if(alive>best){best=alive;localStorage.setItem("wantedRunBest2",String(best));}
  document.getElementById("best").textContent="BEST "+best.toFixed(1)+"s";
  document.getElementById("last").innerHTML="Lasted <b>"+alive.toFixed(1)+"s</b><br/>Cash $"+cash+"<br/>Best "+best.toFixed(1)+"s";
  endEl.classList.add("show");
}
start();
function keepCops(){ const need=3+wanted()*2; while(cops.length<need) cops.push(spawnCop(wanted()>0)); }
function update(dt){
  if(toastT>0){toastT-=dt; if(toastT<=0) toastEl.style.opacity=0;}
  if(state!=="run") return;
  alive+=dt; player.cool=Math.max(0,player.cool-dt); player.hurt=Math.max(0,player.hurt-dt);
  shake=Math.max(0,shake-dt*18); punchT=Math.max(0,punchT-dt); heat=Math.max(0,heat-dt*1.1); keepCops();
  if(keys[" "]||punchTap){doPunch();punchTap=false;keys[" "]=false;}
  if(keys["f"]||carTap){tryCar();carTap=false;keys["f"]=false;}
  let ix=stick.x, iy=stick.y;
  if(keys["a"]||keys["arrowleft"]) ix-=1; if(keys["d"]||keys["arrowright"]) ix+=1;
  if(keys["w"]||keys["arrowup"]) iy-=1; if(keys["s"]||keys["arrowdown"]) iy+=1;
  const mag=Math.hypot(ix,iy); if(mag>1){ix/=mag;iy/=mag;}
  const fwdX=Math.cos(player.a), fwdY=Math.sin(player.a);
  const rgtX=Math.cos(player.a+Math.PI/2), rgtY=Math.sin(player.a+Math.PI/2);
  const mx=fwdX*(-iy)+rgtX*ix, my=fwdY*(-iy)+rgtY*ix;
  if(ix||iy) player.a=Math.atan2(my,mx);
  const spd=player.inCar?240:155;
  move(player,mx*spd*dt,my*spd*dt,player.inCar?16:player.r);
  if(player.inCar){
    let ride=cars[0],bd=1e9;
    for(const c of cars){const d=Math.hypot(c.x-player.x,c.y-player.y); if(d<bd){bd=d;ride=c;}}
    ride.x=player.x; ride.y=player.y; ride.a=player.a;
  }
  for(const p of peds){
    if(p.angry>0){
      p.angry-=dt; const a=Math.atan2(player.y-p.y,player.x-p.x); p.a=a;
      move(p,Math.cos(a)*120*dt,Math.sin(a)*120*dt,p.r);
      if(Math.hypot(p.x-player.x,p.y-player.y)<20 && !player.inCar) hurtPlayer(7);
    } else {
      p.wait-=dt;
      if(p.wait<=0){const go=Math.random()<0.55; p.a=Math.random()*6.28; p.vx=go?Math.cos(p.a)*38:0; p.vy=go?Math.sin(p.a)*38:0; p.wait=0.6+Math.random();}
      move(p,p.vx*dt,p.vy*dt,p.r);
    }
  }
  if(peds.length<30 && Math.random()<dt*0.8) peds.push(spawnPed());
  for(const c of cops){
    c.stun=Math.max(0,c.stun-dt);
    const sees=inCone(c,player.x,player.y);
    if(sees){c.alert=10;c.lost=0;addHeat(dt*4);}
    else if(c.alert>0){c.lost+=dt; if(c.lost>2.4) c.alert=Math.max(0,c.alert-dt*2);}
    if(c.stun>0) continue;
    if(c.alert>0){
      const a=Math.atan2(player.y-c.y,player.x-c.x); c.a=a;
      move(c,Math.cos(a)*(125+wanted()*18)*dt,Math.sin(a)*(125+wanted()*18)*dt,c.r);
      if(Math.hypot(c.x-player.x,c.y-player.y)<22){ if(player.inCar) c.stun=0.3; else hurtPlayer(14); }
    } else {
      c.wait=(c.wait||0)-dt;
      if(c.wait<=0){c.a=Math.random()*6.28;c.wait=1+Math.random()*2;}
      move(c,Math.cos(c.a)*55*dt,Math.sin(c.a)*55*dt,c.r);
    }
  }
  for(const b of bits){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;}
  bits=bits.filter(b=>b.t>0);
  document.getElementById("time").textContent=alive.toFixed(1);
  document.getElementById("cash").textContent="$"+cash;
  document.getElementById("hpbar").style.width=Math.max(0,player.hp)+"%";
  const w=wanted(); document.getElementById("stars").textContent="★".repeat(w)+"☆".repeat(3-w);
}
function drawPerson(x,y,a,body,head,r,lunge){
  ctx.save(); ctx.translate(x,y); ctx.rotate(a);
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(lunge?4:0,0,r+1,r-2,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=head; ctx.beginPath(); ctx.arc(r-1+(lunge?4:0),0,4.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function draw(){
  measure();
  ctx.fillStyle="#241c28"; ctx.fillRect(0,0,viewW,viewH);
  ctx.save();
  const jx=shake?(Math.random()*2-1)*shake:0, jy=shake?(Math.random()*2-1)*shake*0.5:0;
  ctx.translate(viewW/2+jx, viewH/2+40+jy);
  ctx.rotate(-player.a-Math.PI/2);
  ctx.translate(-player.x,-player.y);
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const sx=x*TILE, sy=y*TILE;
    if(map[y][x]===1){ ctx.fillStyle=(x+y)%2?"#6a5678":"#5a4868"; ctx.fillRect(sx,sy,TILE-2,TILE-2); ctx.fillStyle="#f0d36a"; if((x*3+y*5)%4===0) ctx.fillRect(sx+10,sy+12,7,9); }
    else { ctx.fillStyle="#4a4254"; ctx.fillRect(sx,sy,TILE,TILE); ctx.fillStyle="#6e6678"; ctx.fillRect(sx+TILE/2-1,sy,2,TILE); ctx.fillRect(sx,sy+TILE/2-1,TILE,2); }
  }
  for(const c of cops){
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.a);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,CONE_DIST,-CONE_ANG,CONE_ANG); ctx.closePath();
    ctx.fillStyle=c.alert>0?"rgba(255,60,60,0.18)":"rgba(80,160,255,0.14)"; ctx.fill(); ctx.restore();
  }
  for(const car of cars){
    if(player.inCar && Math.hypot(car.x-player.x,car.y-player.y)<12) continue;
    ctx.save(); ctx.translate(car.x,car.y); ctx.rotate(car.a);
    ctx.fillStyle="#d5d8e0"; ctx.fillRect(-18,-10,36,20); ctx.fillStyle="#2a2e38"; ctx.fillRect(8,-8,8,16); ctx.restore();
  }
  for(const p of peds) drawPerson(p.x,p.y,p.a,p.angry>0?"#c45a4a":`hsl(${p.col},40%,62%)`,"#f0d2b4",p.r,0);
  for(const c of cops){
    drawPerson(c.x,c.y,c.a,"#2d5ad6","#f0d2b4",c.r,0);
    ctx.save(); ctx.translate(c.x,c.y);
    const flash=Math.sin(alive*10)>0 && c.alert>0;
    ctx.fillStyle=flash?"#ff3b3b":"#b8e0ff"; ctx.fillRect(-6,-16,5,5);
    ctx.fillStyle=flash?"#b8e0ff":"#ff3b3b"; ctx.fillRect(1,-16,5,5); ctx.restore();
  }
  if(player.inCar){
    ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.a);
    ctx.fillStyle="#e8c547"; ctx.fillRect(-20,-11,40,22); ctx.fillStyle="#111"; ctx.fillRect(8,-8,10,16); ctx.restore();
  } else drawPerson(player.x,player.y,player.a,player.hurt>0?"#fff":"#e8c547","#f3d7b0",player.r,punchT>0?1:0);
  for(const b of bits){ ctx.globalAlpha=Math.max(0,b.t*3); ctx.fillStyle=b.col||"#3ddc84"; ctx.fillRect(b.x,b.y,4,4); ctx.globalAlpha=1; }
  ctx.restore();
}
let last=performance.now();
function loop(now){ const dt=Math.min(0.033,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
