<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>WANTED RUN</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; height:100dvh; background:#1a1520; overflow:hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; touch-action:none; user-select:none; -webkit-user-select:none; }
    #c { position:fixed; left:0; top:0; width:100%; height:100%; display:block; background:#2a2433; }
    #hud { position:fixed; left:0; right:0; top:0; pointer-events:none; padding: calc(8px + env(safe-area-inset-top)) 10px 0; z-index:5; }
    .row { display:flex; justify-content:space-between; gap:8px; }
    .panel { background:rgba(12,10,16,.82); border:1px solid #e8c547; padding:8px 10px; min-width:108px; }
    .label { font-size:10px; letter-spacing:.14em; color:#b7b3a8; }
    .val { font-size:22px; color:#e8c547; line-height:1.1; }
    .val.cash { color:#3ddc84; }
    .stars { color:#ff5a5a; letter-spacing:3px; margin-top:3px; font-size:16px; }
    #toast { position:fixed; top:22%; left:50%; transform:translateX(-50%); color:#ffe07a; font-size:18px; letter-spacing:.14em; z-index:6; text-shadow:0 2px 0 #000; pointer-events:none; opacity:0; }
    #end { display:none; position:fixed; left:50%; top:34%; transform:translate(-50%,-50%); width:min(340px, calc(100vw - 24px)); z-index:8; pointer-events:auto; background:#140f18; border:2px solid #e8c547; padding:18px 16px; text-align:center; }
    #end.show { display:block; }
    #end h1 { margin:0 0 8px; color:#e8c547; letter-spacing:.18em; font-size:22px; }
    #end p { color:#ddd; font-size:13px; line-height:1.5; margin:0 0 14px; }
    #again { width:100%; border:0; background:#e8c547; color:#111; font:800 18px ui-monospace, monospace; letter-spacing:.12em; padding:14px; }
    #pad { position:fixed; left:16px; bottom:calc(16px + env(safe-area-inset-bottom)); width:140px; height:140px; border-radius:50%; z-index:7; background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.28); }
    #knob { position:absolute; width:58px; height:58px; border-radius:50%; background:#e8c547; left:41px; top:41px; }
    #btns { position:fixed; right:14px; bottom:calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; z-index:7; }
    .act { width:76px; height:76px; border-radius:50%; border:2px solid #e8c547; background:rgba(12,10,16,.8); color:#e8c547; font:800 12px ui-monospace, monospace; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="row">
      <div class="panel"><div class="label">TIME ALIVE</div><div class="val" id="time">0.0</div><div class="stars" id="stars">☆☆☆</div></div>
      <div class="panel" style="text-align:right"><div class="label">CASH</div><div class="val cash" id="cash">$0</div><div class="label" id="best">BEST 0.0s</div></div>
    </div>
  </div>
  <div id="toast">MOVE</div>
  <div id="end"><h1>BUSTED</h1><p id="last"></p><button id="again" type="button">PLAY AGAIN</button></div>
  <div id="pad"><div id="knob"></div></div>
  <div id="btns">
    <button class="act" id="btnCar" type="button">CAR</button>
    <button class="act" id="btnSteal" type="button">STEAL</button>
  </div>
  <script>
  (() => {
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const pad = document.getElementById("pad");
    const knob = document.getElementById("knob");
    const toastEl = document.getElementById("toast");
    const endEl = document.getElementById("end");
    const TILE = 48, COLS = 26, ROWS = 20;
    let viewW = 390, viewH = 700, dpr = 1;
    function measure() {
      const vv = window.visualViewport;
      viewW = Math.max(300, Math.round((vv && vv.width) || document.documentElement.clientWidth || window.innerWidth || 390));
      viewH = Math.max(500, Math.round((vv && vv.height) || document.documentElement.clientHeight || window.innerHeight || 844));
      dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = Math.floor(viewW * dpr), h = Math.floor(viewH * dpr);
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; ctx.setTransform(dpr,0,0,dpr,0,0); }
    }
    measure();
    window.addEventListener("resize", measure);
    window.addEventListener("orientationchange", () => setTimeout(measure, 80));
    if (window.visualViewport) window.visualViewport.addEventListener("resize", measure);
    const map = [];
    function buildMap() {
      for (let y = 0; y < ROWS; y++) {
        map[y] = [];
        for (let x = 0; x < COLS; x++) {
          const edge = x===0||y===0||x===COLS-1||y===ROWS-1;
          const block = (x%6>1 && x%6<5) && (y%5>1 && y%5<4);
          map[y][x] = edge || block ? 1 : 0;
        }
      }
      for (let y=8;y<=11;y++) for (let x=11;x<=14;x++) map[y][x]=0;
    }
    buildMap();
    function blocked(px,py,r) {
      const x0=Math.floor((px-r)/TILE), x1=Math.floor((px+r)/TILE), y0=Math.floor((py-r)/TILE), y1=Math.floor((py+r)/TILE);
      for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) if (y<0||x<0||y>=ROWS||x>=COLS||map[y][x]===1) return true;
      return false;
    }
    function openSpot() {
      for (let i=0;i<100;i++) {
        const x=(2+Math.random()*(COLS-4))*TILE, y=(2+Math.random()*(ROWS-4))*TILE;
        if (!blocked(x,y,14)) return {x,y};
      }
      return {x:13*TILE,y:10*TILE};
    }
    const keys={};
    window.addEventListener("keydown", e => { keys[e.key.toLowerCase()]=true; if (e.key==="Enter" && state!=="run") start(); });
    window.addEventListener("keyup", e => { keys[e.key.toLowerCase()]=false; });
    const stick={x:0,y:0,id:null};
    function setStick(cx,cy) {
      const r=pad.getBoundingClientRect();
      let mx=cx-(r.left+r.width/2), my=cy-(r.top+r.height/2);
      const mag=Math.hypot(mx,my)||1, k=Math.min(1,mag/48);
      stick.x=(mx/mag)*k; stick.y=(my/mag)*k;
      knob.style.left=41+stick.x*34+"px"; knob.style.top=41+stick.y*34+"px";
    }
    function clearStick(){ stick.x=stick.y=0; stick.id=null; knob.style.left="41px"; knob.style.top="41px"; }
    pad.addEventListener("pointerdown", e => { e.preventDefault(); stick.id=e.pointerId; pad.setPointerCapture(e.pointerId); setStick(e.clientX,e.clientY); if (state!=="run") start(); });
    pad.addEventListener("pointermove", e => { if (e.pointerId===stick.id) setStick(e.clientX,e.clientY); });
    pad.addEventListener("pointerup", clearStick);
    pad.addEventListener("pointercancel", clearStick);
    let stealTap=false, carTap=false;
    document.getElementById("btnSteal").addEventListener("pointerdown", e => { e.preventDefault(); stealTap=true; if (state!=="run") start(); });
    document.getElementById("btnCar").addEventListener("pointerdown", e => { e.preventDefault(); carTap=true; if (state!=="run") start(); });
    document.getElementById("again").addEventListener("click", start);
    canvas.addEventListener("pointerdown", () => { if (state!=="run") start(); });
    let ac;
    function beep(freq,dur,type,vol){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.type=type||"square"; o.frequency.value=freq; g.gain.value=vol||0.05; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur); o.stop(ac.currentTime+dur);}catch(_){}}
    let state="boot", player, peds, cops, cars, bits, cam, heat, cash, alive, best, shake, toastT, siren;
    best=Number(localStorage.getItem("wantedRunBest")||0);
    document.getElementById("best").textContent="BEST "+best.toFixed(1)+"s";
    function toast(t){ toastEl.textContent=t; toastEl.style.opacity=1; toastT=1.2; }
    function spawnPed(){ const p=openSpot(); return {x:p.x,y:p.y,vx:0,vy:0,wait:Math.random(),r:10,robbed:false,col:Math.random()*50+15}; }
    function spawnCar(){ const p=openSpot(); return {x:p.x,y:p.y,a:Math.random()*6.28}; }
    function resetWorld(){
      player={x:13*TILE,y:10*TILE,r:11,a:0,inCar:false,cool:0};
      if (blocked(player.x,player.y,14)) { const s=openSpot(); player.x=s.x; player.y=s.y; }
      peds=Array.from({length:16}, spawnPed); cops=[]; cars=[spawnCar(),spawnCar(),spawnCar()]; bits=[];
      cam={x:player.x,y:player.y}; heat=0; cash=0; alive=0; shake=0; siren=0;
    }
    resetWorld();
    function wanted(){ if (heat>=78) return 3; if (heat>=42) return 2; if (heat>=16) return 1; return 0; }
    function addHeat(n){ heat=Math.min(100, heat+n); }
    function stealFrom(ped){
      if (ped.robbed) return; ped.robbed=true;
      const take=20+Math.floor(Math.random()*70); cash+=take; addHeat(16); shake=7; toast("+$"+take); beep(240,.07,"square",.06);
      for (let i=0;i<7;i++) bits.push({x:ped.x,y:ped.y,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,t:.35});
    }
    function trySteal(){ if (player.cool>0) return; let hit=null,d0=36; for (const p of peds){ const d=Math.hypot(p.x-player.x,p.y-player.y); if(d<d0){d0=d;hit=p;} } if(hit){ stealFrom(hit); player.cool=0.2; } }
    function tryCar(){
      if (player.inCar){ player.inCar=false; player.cool=0.25; toast("ON FOOT"); beep(130,.08,"sawtooth",.04); return; }
      let car=null,d0=42; for (const c of cars){ const d=Math.hypot(c.x-player.x,c.y-player.y); if(d<d0){d0=d;car=c;} }
      if (car){ player.inCar=true; player.x=car.x; player.y=car.y; player.a=car.a; addHeat(7); toast("JACKED"); beep(90,.1,"sawtooth",.05); player.cool=0.25; }
    }
    function move(o,dx,dy,r){ if(!blocked(o.x+dx,o.y,r)) o.x+=dx; if(!blocked(o.x,o.y+dy,r)) o.y+=dy; }
    function start(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); }catch(_){} resetWorld(); state="run"; endEl.classList.remove("show"); toast("STAY FREE"); beep(220,.1,"square",.05); }
    function busted(){
      state="dead"; if (alive>best){ best=alive; localStorage.setItem("wantedRunBest", String(best)); }
      document.getElementById("best").textContent="BEST "+best.toFixed(1)+"s";
      document.getElementById("last").innerHTML="Lasted <b>"+alive.toFixed(1)+"s</b><br/>Cash $"+cash+"<br/>Best "+best.toFixed(1)+"s";
      endEl.classList.add("show"); beep(70,.35,"triangle",.06);
    }
    start();
    function spawnCops(){
      const need=[0,1,3,6][wanted()];
      while (cops.length<need){
        const side=Math.floor(Math.random()*4); let x=TILE*1.6,y=TILE*1.6;
        if(side===0) y=(2+Math.random()*(ROWS-4))*TILE;
        if(side===1){ x=(COLS-1.6)*TILE; y=(2+Math.random()*(ROWS-4))*TILE; }
        if(side===2){ y=TILE*1.6; x=(2+Math.random()*(COLS-4))*TILE; }
        if(side===3){ y=(ROWS-1.6)*TILE; x=(2+Math.random()*(COLS-4))*TILE; }
        if(!blocked(x,y,12)) cops.push({x,y,r:12,stun:0});
      }
      if (cops.length>need) cops.length=need;
    }
    function update(dt){
      if (toastT>0){ toastT-=dt; if(toastT<=0) toastEl.style.opacity=0; }
      if (state!=="run") return;
      alive+=dt; player.cool=Math.max(0,player.cool-dt); shake=Math.max(0,shake-dt*20); heat=Math.max(0,heat-dt*3.1); siren+=dt*(1+wanted()*4); spawnCops();
      if (keys[" "]||stealTap){ trySteal(); stealTap=false; keys[" "]=false; }
      if (keys["f"]||carTap){ tryCar(); carTap=false; keys["f"]=false; }
      let ix=stick.x, iy=stick.y;
      if (keys["a"]||keys["arrowleft"]) ix-=1; if (keys["d"]||keys["arrowright"]) ix+=1;
      if (keys["w"]||keys["arrowup"]) iy-=1; if (keys["s"]||keys["arrowdown"]) iy+=1;
      const m=Math.hypot(ix,iy); if(m>1){ ix/=m; iy/=m; }
      const spd=player.inCar?230:160; if(ix||iy) player.a=Math.atan2(iy,ix);
      move(player, ix*spd*dt, iy*spd*dt, player.inCar?16:player.r);
      for (const p of peds){
        if (!p.robbed && Math.hypot(p.x-player.x,p.y-player.y)<(player.inCar?22:18)) stealFrom(p);
        if (p.robbed){ const a=Math.atan2(p.y-player.y,p.x-player.x); move(p, Math.cos(a)*95*dt, Math.sin(a)*95*dt, p.r); }
        else { p.wait-=dt; if(p.wait<=0){ const go=Math.random()<0.55; p.vx=go?Math.cos(Math.random()*6.28)*42:0; p.vy=go?Math.sin(Math.random()*6.28)*42:0; p.wait=0.5+Math.random(); } move(p,p.vx*dt,p.vy*dt,p.r); }
      }
      if (peds.filter(p=>!p.robbed).length<9 && Math.random()<dt) peds.push(spawnPed());
      if (player.inCar){ let ride=cars[0], bestD=9999; for (const c of cars){ const d=Math.hypot(c.x-player.x,c.y-player.y); if(d<bestD){bestD=d;ride=c;} } ride.x=player.x; ride.y=player.y; ride.a=player.a; }
      const cspd=100+wanted()*30+Math.min(50,alive);
      for (const c of cops){
        c.stun=Math.max(0,c.stun-dt); if(c.stun>0) continue;
        const a=Math.atan2(player.y-c.y, player.x-c.x); move(c, Math.cos(a)*cspd*dt, Math.sin(a)*cspd*dt, c.r);
        if (player.inCar && Math.hypot(c.x-player.x,c.y-player.y)<24) c.stun=0.25;
        if (Math.hypot(c.x-player.x,c.y-player.y)<(player.inCar?20:18)) { shake=10; busted(); return; }
      }
      for (const b of bits){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.t-=dt; } bits=bits.filter(b=>b.t>0);
      cam.x+=(player.x-cam.x)*Math.min(1,dt*9); cam.y+=(player.y-cam.y)*Math.min(1,dt*9);
      document.getElementById("time").textContent=alive.toFixed(1);
      document.getElementById("cash").textContent="$"+cash;
      const w=wanted(); document.getElementById("stars").textContent="★".repeat(w)+"☆".repeat(3-w);
    }
    function S(x,y){ return [x-cam.x+viewW/2+(shake?(Math.random()*2-1)*shake:0), y-cam.y+viewH/2+(shake?(Math.random()*2-1)*shake*0.5:0)]; }
    function draw(){
      measure();
      ctx.fillStyle="#3a3344"; ctx.fillRect(0,0,viewW,viewH);
      const x0=Math.max(0,Math.floor((cam.x-viewW/2)/TILE)-1), y0=Math.max(0,Math.floor((cam.y-viewH/2)/TILE)-1);
      const x1=Math.min(COLS-1,Math.ceil((cam.x+viewW/2)/TILE)+1), y1=Math.min(ROWS-1,Math.ceil((cam.y+viewH/2)/TILE)+1);
      for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
        const [sx,sy]=S(x*TILE,y*TILE);
        if (map[y][x]===1){ ctx.fillStyle=(x+y)%2?"#6b5a7a":"#5c4d6b"; ctx.fillRect(sx,sy,TILE-2,TILE-2); ctx.fillStyle="#f0d36a"; if((x*3+y*5)%3===0) ctx.fillRect(sx+10,sy+12,8,10); if((x+y*2)%4===0) ctx.fillRect(sx+26,sy+20,8,10); }
        else { ctx.fillStyle="#4a4454"; ctx.fillRect(sx,sy,TILE,TILE); ctx.fillStyle="#7a7386"; ctx.fillRect(sx+TILE/2-1.5,sy,3,TILE); ctx.fillRect(sx,sy+TILE/2-1.5,TILE,3); }
      }
      for (const car of cars){
        if (player.inCar && Math.hypot(car.x-player.x,car.y-player.y)<10) continue;
        const [sx,sy]=S(car.x,car.y); ctx.save(); ctx.translate(sx,sy); ctx.rotate(car.a); ctx.fillStyle="#cfd3dc"; ctx.fillRect(-18,-10,36,20); ctx.fillStyle="#2a2e38"; ctx.fillRect(8,-8,8,16); ctx.restore();
      }
      for (const p of peds){ const [sx,sy]=S(p.x,p.y); ctx.fillStyle=p.robbed?"#8a5a50":`hsl(${p.col},45%,68%)`; ctx.beginPath(); ctx.arc(sx,sy,p.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#222"; ctx.beginPath(); ctx.arc(sx,sy-2,3.2,0,Math.PI*2); ctx.fill(); }
      for (const c of cops){ const [sx,sy]=S(c.x,c.y); ctx.fillStyle="#3b6fe0"; ctx.beginPath(); ctx.arc(sx,sy,c.r,0,Math.PI*2); ctx.fill(); const flash=Math.sin(siren)>0; ctx.fillStyle=flash?"#ff3b3b":"#b8e0ff"; ctx.fillRect(sx-7,sy-16,6,6); ctx.fillStyle=flash?"#b8e0ff":"#ff3b3b"; ctx.fillRect(sx+1,sy-16,6,6); }
      { const [sx,sy]=S(player.x,player.y);
        if (player.inCar){ ctx.save(); ctx.translate(sx,sy); ctx.rotate(player.a); ctx.fillStyle="#e8c547"; ctx.fillRect(-20,-11,40,22); ctx.fillStyle="#111"; ctx.fillRect(8,-8,10,16); ctx.restore(); }
        else { ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(sx,sy,player.r+3,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#e8c547"; ctx.beginPath(); ctx.arc(sx,sy,player.r,0,Math.PI*2); ctx.fill(); ctx.strokeStyle="#111"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+Math.cos(player.a)*16, sy+Math.sin(player.a)*16); ctx.stroke(); }
      }
      for (const b of bits){ const [sx,sy]=S(b.x,b.y); ctx.globalAlpha=Math.max(0,b.t*3); ctx.fillStyle="#3ddc84"; ctx.fillRect(sx,sy,5,5); ctx.globalAlpha=1; }
    }
    let last=performance.now();
    function loop(now){ const dt=Math.min(0.033,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
